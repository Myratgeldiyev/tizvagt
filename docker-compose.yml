services:
  mysql:
    image: mysql:8.4
    container_name: tizvagt-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-tizvagt}
      MYSQL_USER: ${DB_USER:-tizvagt}
      MYSQL_PASSWORD: ${DB_PASSWORD:-tizvagt}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
