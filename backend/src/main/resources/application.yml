spring:
  application:
    name: tizvagt-api

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:tizvagt}
    username: ${DB_USER:tizvagt}
    password: ${DB_PASSWORD:tizvagt}

  jpa:
    open-in-view: false
    properties:
      hibernate:
        # Loads lazy collections for up to 50 parents in one query instead of one query each.
        default_batch_fetch_size: 50
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  data:
    web:
      pageable:
        max-page-size: 100

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  jwt:
    # Dev-only default. Always set JWT_SECRET (base64, at least 32 bytes) in production.
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Ng==}
    expiration: ${JWT_EXPIRATION:24h}

  storage:
    upload-dir: ${UPLOAD_DIR:uploads}
